plugins { id 'net.fabricmc.fabric-loom' version '1.16.3'; id 'java-library' }
version = "${mod_version}+26.1.2-fabric"
group = mod_group_id
base.archivesName = 'visual-jei-recipe-maker'
java.toolchain.languageVersion = JavaLanguageVersion.of(25)
repositories {
    maven { url='https://modmaven.dev'; content { includeGroup 'mezz.jei'; includeGroup 'net.mezzdev.config' } }
    maven { url='https://maven.terraformersmc.com/releases/' }
}
loom {
    runs {
        client { client(); runDir 'run/client' }
        server { server(); runDir 'run/server'; programArg '--nogui' }
        clientCheck { client(); runDir 'run/client-check'; vmArg '-Dvjrm.verifyClient=true'; programArgs '--quickPlaySingleplayer','Vjrm UI Verification','--width','1280','--height','720' }
        serverCheck { server(); runDir 'run/server-check'; vmArg '-Dvjrm.verifyServer=true'; programArg '--nogui' }
    }
    mods { vjrm { sourceSet sourceSets.main }; if(project.hasProperty('verifyRuntime'))vjrm_checks { sourceSet sourceSets.test } }
}
dependencies {
    minecraft "com.mojang:minecraft:${minecraft_version}"
    implementation "net.fabricmc:fabric-loader:${loader_version}"
    implementation "net.fabricmc.fabric-api:fabric-api:${fabric_api_version}"
    compileOnly("mezz.jei:jei-${minecraft_version}-fabric:${jei_version}") { transitive=false }
    if(!project.hasProperty('withoutJei') && (!project.hasProperty('viewer') || project.property('viewer')!='emi'))runtimeOnly("mezz.jei:jei-${minecraft_version}-fabric:${jei_version}") { transitive=false }
}
processResources { inputs.property 'version',mod_version; filesMatching('fabric.mod.json') { expand version:mod_version } }
jar { manifest { attributes('Implementation-Version':project.version) } }
tasks.withType(JavaCompile).configureEach { options.encoding='UTF-8'; options.compilerArgs += ['-Xmaxerrs','500'] }
sourceSets.test.compileClasspath += sourceSets.main.compileClasspath
sourceSets.test.runtimeClasspath += sourceSets.main.runtimeClasspath
tasks.named('test') { failOnNoDiscoveredTests=false }

tasks.named('runServerCheck') { doFirst {
    if(!project.hasProperty('verifyRuntime'))throw new GradleException('Use -PverifyRuntime')
    file('build/verification/server/result.txt').delete()
    def dir=file('run/server-check');dir.mkdirs();new File(dir,'eula.txt').text='eula=true\n'
    def props=new File(dir,'server.properties');if(!props.exists())props.text='online-mode=false\nserver-port=25577\nlevel-name=world\nlevel-type=minecraft:flat\ngenerate-structures=false\nview-distance=2\nsimulation-distance=2\n'
} }
tasks.named('runClientCheck') { doFirst {
    if(!project.hasProperty('verifyRuntime'))throw new GradleException('Use -PverifyRuntime')
    file('build/verification/client/result.txt').delete()
    def world=file('run/client-check/saves/Vjrm UI Verification')
    if(!world.exists()) {if(!file('run/server-check/world/level.dat').exists())throw new GradleException('Run verifyServer first');copy { from 'run/server-check/world';into world } }
    def options=file('run/client-check/options.txt');if(!options.exists())options.text='lang:zh_cn\nguiScale:2\nrenderDistance:2\nsimulationDistance:2\nmaxFps:60\nsoundCategory_master:0.0\n'
} }
['Server','Client'].each { side -> tasks.register("verify${side}") {
    dependsOn "run${side}Check"
    doLast {def result=file("build/verification/${side.toLowerCase()}/result.txt");if(!result.exists()||!result.text.startsWith('PASS:'))throw new GradleException("${side} checks failed; see ${result}")}
} }

tasks.matching { it.name in ['runServerCheck','runClientCheck'] }.configureEach {
    dependsOn tasks.testClasses
    classpath += sourceSets.test.runtimeClasspath
}
