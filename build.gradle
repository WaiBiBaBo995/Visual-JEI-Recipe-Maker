plugins {
    id 'java-library'
    id 'net.neoforged.moddev' version '2.0.107'
}

version = mod_version
group = mod_group_id

java.toolchain.languageVersion = JavaLanguageVersion.of(21)

repositories {
    maven { url = 'https://modmaven.dev' }
    maven { url = 'https://maven.terraformersmc.com/releases/' }
}

neoForge {
    version = neo_version
    runs {
        client { client(); gameDirectory = file('run/client') }
        clientCheck {
            if(project.hasProperty("verifyIcons")){ systemProperty "vjrm.verifyIcons","true"; programArgument "--width"; programArgument "1280"; programArgument "--height"; programArgument "720" }
            client(); gameDirectory = file('run/client-check')
            if(project.hasProperty("verifyGt")) systemProperty "vjrm.verifyGt","true"
            systemProperty 'vjrm.verifyClient', 'true'
            if (project.hasProperty('viewer') && project.property('viewer') in ['emi', 'both']) systemProperty 'vjrm.verifyEmi', 'true'
            if (project.hasProperty('verifyCreate')) systemProperty 'vjrm.verifyCreate', 'true'
            if (project.hasProperty('verifyAstral')) systemProperty 'vjrm.verifyAstral', 'true'
            programArgument '--quickPlaySingleplayer'
            programArgument 'Vjrm UI Verification'
        }
        gtServer { server(); gameDirectory = file(project.hasProperty("gtSnapshotRuntime")?"run/gt-server-snapshot":"run/gt-stable-server"); programArgument "--nogui"; systemProperty "vjrm.verifyGtServer","true" }
        server { server(); gameDirectory = file('run/server'); programArgument '--nogui' }
        recipeCheck {
            type = 'gameTestServer'
            gameDirectory = file('run/recipe-check')
            systemProperty 'neoforge.enabledGameTestNamespaces', 'vjrm'
        }
    }
    mods { vjrm { sourceSet(sourceSets.main); sourceSet(sourceSets.test) } }
}
jar { manifest { attributes('Implementation-Version': project.version) } }

dependencies {
    if(project.hasProperty("verifyGt")) { if(project.hasProperty("gtSnapshotRuntime"))runtimeOnly files("build/compat-deps/gt21-snapshot.jar","build/compat-deps/21-kubejs-current.jar","build/compat-deps/21-rhino.jar","build/compat-deps/21-configuration.jar"); else runtimeOnly files("build/compat-deps/gt21.jar","build/compat-deps/21-kubejs.jar","build/compat-deps/21-rhino.jar","build/compat-deps/21-configuration.jar") }
    if (project.hasProperty('verifyAstral')) runtimeOnly fileTree('build/verification/deps/astral') { include '*.jar' }
    if (project.hasProperty('verifyCreate')) runtimeOnly files('build/verification/deps/create-1.21.1-6.0.10.jar')
    compileOnly "mezz.jei:jei-${minecraft_version}-neoforge:${jei_version}"
    compileOnly "dev.emi:emi-neoforge:${emi_version}"
    if (!project.hasProperty('viewer') || project.property('viewer') != 'emi') runtimeOnly "mezz.jei:jei-${minecraft_version}-neoforge:${jei_version}"
    if (project.hasProperty('viewer') && project.property('viewer') in ['emi', 'both']) runtimeOnly "dev.emi:emi-neoforge:${emi_version}"
}

sourceSets.main.resources.srcDir 'src/generated/resources'
sourceSets.test.compileClasspath += sourceSets.main.compileClasspath
sourceSets.test.runtimeClasspath += sourceSets.main.runtimeClasspath

tasks.withType(JavaCompile).configureEach { options.encoding = 'UTF-8' }

tasks.register('verifyRecipes') { dependsOn 'runRecipeCheck' }
tasks.named('runClientCheck') { doFirst { file('build/verification/client/result.txt').delete() } }

tasks.register('verifyClient') {
    dependsOn 'runClientCheck'
    doLast {
        def result = file('build/verification/client/result.txt')
        if (!result.exists() || !result.text.startsWith('PASS:')) throw new GradleException('Client verification failed; see build/verification/client/result.txt')
    }
}

tasks.named('runGtServer') { doFirst { def dir=file(project.hasProperty('gtSnapshotRuntime')?'run/gt-server-snapshot':'run/gt-stable-server');dir.mkdirs();new File(dir,'eula.txt').text='eula=true\n';new File(dir,'server.properties').text='online-mode=false\nserver-port=25578\nlevel-type=minecraft:flat\ngenerate-structures=false\nview-distance=2\nsimulation-distance=2\n' } }

tasks.matching { it.name == 'runGtServer' }.configureEach {
    doFirst { if(project.hasProperty('verifyGt'))file('build/verification/gt-server/result.txt').delete() }
    doLast { if(project.hasProperty('verifyGt')) { def result=file('build/verification/gt-server/result.txt');if(!result.exists()||!result.text.startsWith('PASS:'))throw new GradleException('GT server verification failed') } }
}

tasks.matching { it.name == 'runClientCheck' }.configureEach {
    doFirst { if(project.hasProperty('verifyGt'))file('build/verification/gt-client/result.txt').delete() }
    doLast { if(project.hasProperty('verifyGt')) { def result=file('build/verification/gt-client/result.txt');if(!result.exists()||!result.text.startsWith('PASS:'))throw new GradleException('GT client verification failed') } }
}

// Explicitly check this run's result rather than accepting a successful game exit.
tasks.matching { it.name in ['runClientCheck','runClient'] }.configureEach {
    if(project.hasProperty('verifyIcons')) {
        doFirst { file('build/verification/icons/result.txt').delete(); def options=file('run/client-check/options.txt'); if(options.exists())options.text=options.text.replaceAll('(?m)^guiScale:.*', 'guiScale:2') }
        doLast {def result=file('build/verification/icons/result.txt');if(!result.exists()||!result.text.startsWith('PASS:'))throw new GradleException("Icon checks failed; see ${result}")}
    }
}

// Resolve the release version into loader metadata before packaging.
tasks.named('processResources') {
    inputs.property 'mod_version', mod_version
    filesMatching('META-INF/*mods.toml') { expand mod_version: mod_version }
}
