// Optional fallback when Gradle cannot reach the NeoForge configuration endpoint.
// Fetch build/neoforge-moddev-config.json for the pinned NeoForge version first.
allprojects {
    afterEvaluate {
        configurations.named('neoForgeConfigOnly') {
            dependencies.clear()
            dependencies.add(project.dependencies.create(project.files('build/neoforge-moddev-config.json')))
        }
    }
}
